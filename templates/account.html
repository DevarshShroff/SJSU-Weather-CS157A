{% extends 'base.html' %}
{% block title %}Account{% endblock %}
{% block content %}
<div class="form-page form-page--wide">
  <h1>Account</h1>
  <form method="post" class="card card-body">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="mb-3"><label class="form-label" for="email">Email</label><input class="form-control" id="email" value="{{ g.user.email }}" disabled></div>
    <div class="mb-3"><label class="form-label" for="display_name">Display name</label><input class="form-control" id="display_name" name="display_name" value="{{ g.user.display_name }}" required></div>
    <div class="mb-3"><label class="form-label" for="password">New password</label><input class="form-control" type="password" id="password" name="password" minlength="10"><div class="form-text">Leave blank to keep the current password.</div></div>
    <div><button class="btn btn-primary">Save changes</button></div>
  </form>
</div>
{% endblock %}
